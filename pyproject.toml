[project]
name = "pynamo"
version = "0.1.0"
description = "Pydantic models and utilities for DynamoDB."
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.44.3",
    "botocore>=1.44.3",
    "mypy-boto3-dynamodb>=1.44.0",
    "pydantic>=2.14.3",
]

[project.optional-dependencies]
graphql = [
    "graphql-core>=3.3.2",
]
