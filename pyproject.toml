[project]
name = "tidal"
version = "0.1.0"
description = "Event-driven applications on DynamoDB and AWS AppSync, built from pydantic models."
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.44.3",
    "botocore>=1.44.3",
    "mypy-boto3-dynamodb>=1.44.0",
    "pydantic>=2.14.3",
]

[project.optional-dependencies]
graphql = [
    "graphql-core>=3.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Measure coverage of the package on every run, reported in the terminal and as HTML
addopts = [
    "--import-mode=importlib",
    "--cov=tidal",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
]

[tool.coverage.run]
# Count branches taken, not only lines run
branch = true
source = ["tidal"]

[tool.coverage.html]
# Write the HTML report to htmlcov/, which is gitignored
directory = "htmlcov"
